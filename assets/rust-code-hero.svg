<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">rust-code hero banner</title>
  <desc id="desc">A polished terminal-inspired banner for a Rust implementation of a Claude Code-style coding agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#10231f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.52" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172033" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="36" fill="url(#grid)"/>
  <path d="M0 540C180 492 296 582 474 532C666 478 746 334 936 300C1084 274 1182 320 1280 276V640H0Z" fill="#22c55e" opacity="0.09"/>
  <path d="M0 94C174 134 278 64 446 104C666 156 766 244 1018 202C1136 182 1216 132 1280 116V0H0Z" fill="#38bdf8" opacity="0.07"/>

  <g transform="translate(80 74)">
    <rect x="0" y="0" width="1120" height="492" rx="24" fill="url(#panel)" stroke="#334155" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1120" height="56" rx="24" fill="#0f172a"/>
    <path d="M0 32Q0 0 32 0H1088Q1120 0 1120 32V56H0Z" fill="#111827"/>
    <circle cx="34" cy="28" r="8" fill="#fb7185"/>
    <circle cx="62" cy="28" r="8" fill="#fbbf24"/>
    <circle cx="90" cy="28" r="8" fill="#34d399"/>
    <text x="560" y="35" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">remote-code --print "ship the fix"</text>

    <g transform="translate(58 104)">
      <text x="0" y="0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="82" font-weight="800" fill="#f8fafc">rust-code</text>
      <rect x="0" y="30" width="412" height="6" rx="3" fill="url(#accent)"/>
      <text x="0" y="92" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1">A Claude Code-style agent runtime in Rust</text>
      <text x="0" y="140" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#94a3b8">CLI • TUI • Headless • MCP • Permissions • Sessions • Plugins</text>
      <text x="0" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#86efac">$ cargo run -p remote-code -- tui</text>
    </g>

    <g transform="translate(700 116)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="0" y="0" width="352" height="258" rx="14" fill="#020617" stroke="#1f2937"/>
      <text x="24" y="38" font-size="16" fill="#38bdf8">runtime.rs</text>
      <text x="24" y="76" font-size="15" fill="#64748b">1</text>
      <text x="58" y="76" font-size="15" fill="#e2e8f0">async fn turn(input) {</text>
      <text x="24" y="108" font-size="15" fill="#64748b">2</text>
      <text x="58" y="108" font-size="15" fill="#f97316">  guard.permissions();</text>
      <text x="24" y="140" font-size="15" fill="#64748b">3</text>
      <text x="58" y="140" font-size="15" fill="#22c55e">  tools.execute().await;</text>
      <text x="24" y="172" font-size="15" fill="#64748b">4</text>
      <text x="58" y="172" font-size="15" fill="#38bdf8">  session.persist();</text>
      <text x="24" y="204" font-size="15" fill="#64748b">5</text>
      <text x="58" y="204" font-size="15" fill="#e2e8f0">}</text>
      <rect x="24" y="224" width="304" height="1" fill="#1f2937"/>
      <text x="24" y="244" font-size="13" fill="#94a3b8">194 tests passing • 30 crates</text>
    </g>

    <g transform="translate(58 404)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
      <rect x="0" y="0" width="162" height="42" rx="21" fill="#1f2937" stroke="#334155"/>
      <text x="81" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Memory-safe</text>
      <rect x="182" y="0" width="132" height="42" rx="21" fill="#1f2937" stroke="#334155"/>
      <text x="248" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Async-first</text>
      <rect x="334" y="0" width="176" height="42" rx="21" fill="#1f2937" stroke="#334155"/>
      <text x="422" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Production-minded</text>
    </g>
  </g>
</svg>
