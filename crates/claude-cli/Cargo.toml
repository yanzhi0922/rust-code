[package]
name = "claude-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "claude"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
rustyline = { workspace = true }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true, features = ["html"] }
futures = { workspace = true }
dirs = { workspace = true }
claude-runtime = { workspace = true }
claude-api = { workspace = true }
claude-tools = { workspace = true }
claude-commands = { workspace = true }
claude-plugins = { workspace = true }
claude-telemetry = { workspace = true }
