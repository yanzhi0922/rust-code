[workspace]
members = [
    "apps/remote-code-control-plane",
    "apps/remote-code-migrate",
    "apps/remote-code-runner",
    # Remote Code (claude) crates
    "crates/claude/*",
    # Adapter crates
    "crates/adapters/*",
    # Shared crates (agent-protocol, engine-events — used by all 3 agents)
    "crates/shared/*",
    "apps/remote-code-gui/src-tauri",
    "agents/claudecode",
    # Codex leaf crates (Stage 1) — listed explicitly to avoid glob issues
    "crates/codex/ansi-escape",
    "crates/codex/async-utils",
    "crates/codex/codex-backend-openapi-models",
    "crates/codex/codex-experimental-api-macros",
    "crates/codex/collaboration-mode-templates",
    "crates/codex/device-key",
    "crates/codex/process-hardening",
    "crates/codex/terminal-detection",
    "crates/codex/uds",
    # Codex Stage 2 crates (depend on leaf crates)
    "crates/codex/codex-client",
    "crates/codex/execpolicy",
    "crates/codex/responses-api-proxy",
    "crates/codex/skills",
    "crates/codex/stdio-to-uds",
    # Codex Stage 3 crates (depend on stage 2)
    "crates/codex/install-context",
    "crates/codex/network-proxy",
    # Codex Stage 4: protocol (key crate — unlocks ~40 crates)
    "crates/codex/protocol",
    # Codex Stage 5: protocol-dependent crates
    "crates/codex/agent-identity",
    "crates/codex/codex-api",
    "crates/codex/sandboxing",
    "crates/codex/shell-command",
    # Codex Stage 6: app-server-protocol + codex-api (unblocked by tungstenite patch)
    "crates/codex/app-server-protocol",
    # Codex Stage 7: api/protocol-dependent crates
    "crates/codex/connectors",
    "crates/codex/debug-client",
    "crates/codex/model-provider-info",
    "crates/codex/otel",
    "crates/codex/response-debug-context",
    # Codex Stage 8: features (feature flags)
    "crates/codex/features",
    # Codex Stage 9: config (key crate — unlocks hooks, login, exec-server)
    "crates/codex/config",
    # Codex Stage 10: config-dependent crates
    "crates/codex/hooks",
    "crates/codex/login",
    # Codex Stage 11: login-dependent crates
    "crates/codex/feedback",
    "crates/codex/models-manager",
    # Codex Stage 12: model-provider (key unlocker)
    "crates/codex/model-provider",
    # Codex Stage 13: exec-server, shell-escalation, backend-client
    "crates/codex/exec-server",
    "crates/codex/shell-escalation",
    "crates/codex/backend-client",
    # Codex Stage 13.5: new crates from upstream update
    "crates/codex/agent-graph-store",
    "crates/codex/core-api",
    "crates/codex/file-system",
    # Codex Stage 14: exec-server-dependent crates
    "crates/codex/apply-patch",
    "crates/codex/git-utils",
    "crates/codex/rmcp-client",
    "crates/codex/utils/plugins",
    "crates/codex/app-server-transport",
    # Codex Stage 15: cloud-tasks-client, plugin, secrets, state
    "crates/codex/cloud-tasks-client",
    "crates/codex/plugin",
    "crates/codex/secrets",
    "crates/codex/state",
    # Codex Stage 16: analytics, cloud-tasks-mock-client, codex-mcp, rollout
    "crates/codex/analytics",
    "crates/codex/cloud-tasks-mock-client",
    "crates/codex/codex-mcp",
    "crates/codex/rollout",
    # Codex Stage 17: core-skills, thread-store
    "crates/codex/core-skills",
    "crates/codex/thread-store",
    # Codex Stage 18: core-plugins
    "crates/codex/core-plugins",
    # Codex utils leaf crates
    "crates/codex/utils/absolute-path",
    "crates/codex/utils/cache",
    "crates/codex/utils/elapsed",
    "crates/codex/utils/fuzzy-match",
    "crates/codex/utils/json-to-toml",
    "crates/codex/utils/pty",
    "crates/codex/utils/readiness",
    "crates/codex/utils/rustls-provider",
    "crates/codex/utils/sleep-inhibitor",
    "crates/codex/utils/stream-parser",
    "crates/codex/utils/string",
    "crates/codex/utils/template",
    # Codex utils Stage 2
    "crates/codex/utils/home-dir",
    "crates/codex/utils/image",
    "crates/codex/utils/path-utils",
    # Codex utils Stage 3
    "crates/codex/utils/approval-presets",
    "crates/codex/utils/cli",
    "crates/codex/utils/output-truncation",
    # Codex Stage 18.5: new crates from upstream update
    "crates/codex/external-agent-migration",
    "crates/codex/external-agent-sessions",
    "crates/codex/memories/read",
    "crates/codex/memories/write",
    # Codex Stage 19: code-mode service, rollout-trace, tools, core
    "crates/codex/code-mode",
    "crates/codex/rollout-trace",
    "crates/codex/tools",
    "crates/codex/core",
    # Codex Stage 20: core-dependent crates
    "crates/codex/app-server-test-client",
    "crates/codex/app-server/tests/common",
    "crates/codex/core/tests/common",
    "crates/codex/chatgpt",
    "crates/codex/cloud-requirements",
    "crates/codex/linux-sandbox",
    "crates/codex/lmstudio",
    "crates/codex/ollama",
    "crates/codex/utils/cargo-bin",
    "crates/codex/utils/sandbox-summary",
    # Codex Stage 21: arg0, utils/oss
    "crates/codex/arg0",
    "crates/codex/utils/oss",
    # Codex Stage 22: mcp-server, test-binary-support
    "crates/codex/mcp-server",
    "crates/codex/mcp-server/tests/common",
    "crates/codex/test-binary-support",
    # Codex Stage 23: app-server
    "crates/codex/app-server",
    # Codex Stage 24: app-server-client
    "crates/codex/app-server-client",
    # Codex Stage 25: exec
    "crates/codex/exec",
    # Codex Stage 26: windows-sandbox-rs
    "crates/codex/windows-sandbox-rs",
    # Codex Stage 27: cloud-tasks, tui, cli (final crates — circular deps)
    "crates/codex/cloud-tasks",
    "crates/codex/tui",
    "crates/codex/cli",
    # Roo crates (merged from crates/roo workspace)
    "crates/roo/roo-types",
    "crates/roo/roo-jsonrpc",
    "crates/roo/roo-provider",
    "crates/roo/roo-provider-anthropic",
    "crates/roo/roo-provider-aws",
    "crates/roo/roo-provider-baseten",
    "crates/roo/roo-provider-deepseek",
    "crates/roo/roo-provider-fireworks",
    "crates/roo/roo-provider-google",
    "crates/roo/roo-provider-litellm",
    "crates/roo/roo-provider-lmstudio",
    "crates/roo/roo-provider-minimax",
    "crates/roo/roo-provider-mistral",
    "crates/roo/roo-provider-moonshot",
    "crates/roo/roo-provider-ollama",
    "crates/roo/roo-provider-openai",
    "crates/roo/roo-provider-openai-native",
    "crates/roo/roo-provider-openrouter",
    "crates/roo/roo-provider-poe",
    "crates/roo/roo-provider-qwen",
    "crates/roo/roo-provider-requesty",
    "crates/roo/roo-provider-roo",
    "crates/roo/roo-provider-sambanova",
    "crates/roo/roo-provider-unbound",
    "crates/roo/roo-provider-vercel",
    "crates/roo/roo-provider-fake-ai",
    "crates/roo/roo-provider-vscode-lm",
    "crates/roo/roo-provider-xai",
    "crates/roo/roo-provider-zai",
    "crates/roo/roo-tools",
    "crates/roo/roo-tools-command",
    "crates/roo/roo-tools-fs",
    "crates/roo/roo-tools-mcp",
    "crates/roo/roo-tools-misc",
    "crates/roo/roo-tools-mode",
    "crates/roo/roo-tools-search",
    "crates/roo/roo-mcp",
    "crates/roo/roo-task",
    "crates/roo/roo-prompt",
    "crates/roo/roo-context",
    "crates/roo/roo-condense",
    "crates/roo/roo-checkpoint",
    "crates/roo/roo-diff",
    "crates/roo/roo-index",
    "crates/roo/roo-skills",
    "crates/roo/roo-modes",
    "crates/roo/roo-config",
    "crates/roo/roo-telemetry",
    "crates/roo/roo-cloud",
    "crates/roo/roo-i18n",
    "crates/roo/roo-ignore",
    "crates/roo/roo-protect",
    "crates/roo/roo-terminal",
    "crates/roo/roo-editor",
    "crates/roo/roo-marketplace",
    "crates/roo/roo-mdm",
    "crates/roo/roo-command",
    "crates/roo/roo-worktree",
    "crates/roo/roo-custom-tools",
    "crates/roo/roo-mentions",
    "crates/roo/roo-environment",
    "crates/roo/roo-message-manager",
    "crates/roo/roo-message-queue",
    "crates/roo/roo-task-persistence",
    "crates/roo/roo-context-tracking",
    "crates/roo/roo-auto-approval",
    "crates/roo/roo-app",
    "crates/roo/roo-server",
    "crates/roo/roo-cli",
    "crates/roo/roo-tree-sitter",
]
exclude = [
    "apps/remote-code-gui",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Proprietary"
authors = ["Yanzh"]
repository = "https://github.com/yanzhi0922/remote-code-rust"
rust-version = "1.93"

[workspace.dependencies]
# ── Shared deps (rc-* + codex) ──────────────────────────────────
