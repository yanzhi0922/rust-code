[workspace]
members = [
    "crates/claude-cli",
    "crates/api",
    "crates/runtime",
    "crates/tools",
    "crates/commands",
    "crates/plugins",
    "crates/telemetry",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
futures = "0.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
glob = "0.3"
regex = "1"
once_cell = "1"
walkdir = "2"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
url = "2"
rustyline = "15"
crossterm = "0.28"
syntect = "5"
pulldown-cmark = { version = "0.13", default-features = false }
clap = { version = "4", features = ["derive"] }
etcetera = "0.8"
toml = "0.8"
jsonschema = "0.22"
async-trait = "0.1"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

claude-api = { path = "crates/api" }
claude-runtime = { path = "crates/runtime" }
claude-tools = { path = "crates/tools" }
claude-commands = { path = "crates/commands" }
claude-plugins = { path = "crates/plugins" }
claude-telemetry = { path = "crates/telemetry" }
