[advisories]
# Accepted 2026-05-17 by release engineering; review by 2026-06-30.
#
# Blocking vulnerabilities:
# - RUSTSEC-2026-0118 / RUSTSEC-2026-0119: hickory-proto 0.25.2 is pulled
#   through rama 0.3.0-alpha.4 in codex-network-proxy. No fixed 0.25.x release
#   exists; revisit when rama upgrades to hickory 0.26 or a patched branch.
# - RUSTSEC-2023-0071: rsa 0.9.10 is pulled through sqlx-mysql in sqlx's macro
#   dependency graph. The application configures SQLite-only sqlx features;
#   remove this ignore when sqlx no longer resolves sqlx-mysql/rsa into the
#   workspace lockfile.
#
# Non-blocking warning accepts:
# - GTK/WebKit/ATK stack advisories are transitive through Tauri/Wry Linux GUI
#   dependencies. The primary supported desktop release is Windows; Linux GUI
#   publishing must refresh these before general availability.
# - ratatui/paste/syntect/urlpattern/lru/rustls-pemfile accepts are tracked so
#   cargo audit remains quiet in CI while dependency owners ship fixed versions.
#   Do not add new entries without a short risk note and review date.
